[package]
name = "fsx"
version = "0.1.0"
edition = "2024"
description = "Shared filesystem facts and traversal primitives for the fsx tools"
license = "MIT"
build = "build.rs"

[features]
default = []
scan = ["dep:jwalk", "dep:rayon"]
ignore = ["dep:ignore"]
git = []
terminal = []
ntfs = ["dep:ntfs"]
colors = ["dep:regex"]
index = ["dep:rusqlite"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ignore = { version = "0.4.25", optional = true }
jwalk = { version = "0.8.1", optional = true }
libc = "0.2.183"
ntfs = { version = "0.4.0", optional = true }
rayon = { version = "1.11.0", optional = true }
regex = { version = "1.12.2", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "fsx_primitives"
harness = false

[lints.rust]
unsafe_code = "allow"
