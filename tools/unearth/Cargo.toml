[package]
name = "unearth"
license = "MIT"
version = "0.9.6"
edition = "2021"

[features]
default = []
watcher = ["dep:jemalloc-sys", "dep:libc"]

[[bin]]
name = "unearth"
path = "src/bin/unearth.rs"

[[bin]]
name = "unearthd"
path = "src/bin/unearthd.rs"
required-features = ["watcher"]

[dependencies]
fsx = { workspace = true, features = ["colors", "ignore", "index", "terminal", "ntfs"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
rayon = "1"
crossbeam-channel = "0.5"
jemallocator = "0.5"
jemalloc-sys = { version = "0.5", optional = true }
jwalk = "0.8"
ntfs = "0.4.0"
rusqlite = { version = "0.32", features = ["bundled"] }
memmap2 = "0.9"
libc = { version = "0.2", optional = true }
