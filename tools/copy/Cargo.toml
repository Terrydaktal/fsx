[package]
name = "copy-rs"
license = "MIT"
version = "0.2.4"
edition = "2021"

[features]
default = ["jemalloc"]
jemalloc = ["dep:jemallocator"]
diagnostic-hooks = []

[dependencies]
fsx = { workspace = true, features = ["terminal"] }
filetime = "0.2"
sha2 = "0.10"
jemallocator = { version = "0.5", optional = true }
jwalk = "0.8"
nix = { version = "0.29", default-features = false, features = ["fs"] }
rayon = "1.10"
regex = "1"
rustc-hash = "2"
tempfile = "3"
